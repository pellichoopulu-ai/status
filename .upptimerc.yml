# pgforge MANUAL Part 36; the plan: the app's docs/STATUS-PAGE.md. This repository is public: no names, addresses or
# internal details of anyone or anything, in here or in any issue.
owner: pellichoopulu-ai
repo: status
assignees:
  - pellichoopulu-user
skipDeleteIssues: true
sites:
  # Until go-live: the one path Cloudflare Access leaves open on the test site. It answers 404 until the app has that
  # file; a redirect to the sign-in gate or an outage's 5xx counts as down. At go-live this becomes the real site.
  - name: Test site
    url: https://dev.pellichoopulu.ai/.well-known/assetlinks.json
    expectedStatusCodes:
      - 404
    maxResponseTime: 5000
  - name: Monitoring drill
    url: https://pellichoopulu-ai.github.io/status/no-such-page-drill
status-website:
  cname: status.pellichoopulu.ai
  name: Pellichoopulu status
  introTitle: "Is Pellichoopulu working?"
  introMessage: "If something isn't working for you, this page says whether we know about it."
